name: iPad app

# Builds the unsigned OpenTiles.ipa that people sign with their own Apple ID and install themselves
# (ADR 0023, docs/ipad-app.md), and runs the CoreMIDI plugin's tests. Separate from ci.yml: it needs
# a macOS runner and never holds up the website's deploy.
#
# The app ships the web app, so every change to the site is a change to the app: it runs on every
# pull request and on main, not only when apps/ios-shell changes (PLAN.md P3-09).
on:
  pull_request:
  # A version tag (v0.2.0) also builds the release files and puts them on a draft release, which
  # the maintainer reads and publishes by hand.
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ipa:
    name: Unsigned IPA and plugin tests
    # Capacitor 8 needs Xcode 26 or newer.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count, so it needs the whole history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: A tag names the version in apps/ios-shell/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./apps/ios-shell/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app's version $version"
            exit 1
          fi
      # The public web build (as deployed), cap sync, then an unsigned Release build zipped as an IPA.
      - run: pnpm --filter @opentiles/ios-shell ipa
      - name: Choose an iPad simulator
        run: |
          udid="$(xcrun simctl list devices available --json | node -e '
            const { devices } = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const ipad = Object.entries(devices)
              .filter(([runtime]) => runtime.includes("iOS"))
              .flatMap(([, list]) => list)
              .find((d) => d.name.startsWith("iPad"));
            if (!ipad) { console.error("No iPad simulator on this runner"); process.exit(1); }
            console.log(ipad.udid);
          ')"
          echo "IPAD_UDID=$udid" >> "$GITHUB_ENV"
      - name: Plugin tests on an iPad simulator
        working-directory: apps/ios-shell/plugins/core-midi
        run: xcodebuild test -quiet -scheme OpentilesCapacitorCoreMidi -destination "id=$IPAD_UDID"
      # The app itself with the web build that `ipa` synced: it starts, and Home, a catalogue piece
      # and a chord drill open in its WebView (ios/App/AppUITests, PLAN.md P3-10).
      - name: The app on an iPad simulator
        working-directory: apps/ios-shell
        run: >-
          xcodebuild test -quiet -project ios/App/App.xcodeproj -scheme App
          -destination "id=$IPAD_UDID" -derivedDataPath build/dd-test
          -resultBundlePath build/AppUITests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Keep the UI test results (screenshots) when they fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: AppUITests-xcresult
          path: apps/ios-shell/build/AppUITests.xcresult
          if-no-files-found: ignore
      - name: AltStore / SideStore source
        run: >-
          node apps/ios-shell/scripts/altstore-source.mjs apps/ios-shell/build/OpenTiles.ipa
          "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OpenTiles.ipa"
          > apps/ios-shell/build/altstore.json
      - uses: actions/upload-artifact@v7
        with:
          name: OpenTiles-ipa
          path: |
            apps/ios-shell/build/OpenTiles.ipa
            apps/ios-shell/build/altstore.json
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: OpenTiles-ipa
          path: release
      # The install steps first, then GitHub's list of merged pull requests.
      - name: Attach the IPA and the source to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag
          --title "OpenTiles $GITHUB_REF_NAME" --notes-file apps/ios-shell/release-notes.md
          --generate-notes release/OpenTiles.ipa release/altstore.json
