name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests and synthetic accuracy harness
        run: cargo test --workspace --release -- --nocapture
      - name: Clippy on the SIMD build
        env:
          RUSTFLAGS: -C target-feature=+simd128
        run: >-
          cargo clippy --target wasm32-unknown-unknown --target-dir target/wasm-simd
          -p opentiles-engine --lib --features simd -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Builds dist/engine.wasm (baseline) and dist/engine-simd.wasm, then check-wasm.mjs checks
      # both: no imports, every export, silence stays silent, and SIMD only in the SIMD build.
      - name: Build both wasm modules and check them
        run: node packages/engine/scripts/build.mjs
      - name: Benchmark both wasm modules
        run: node packages/engine/scripts/bench-wasm.mjs --seconds 10 --runs 3

  web:
    name: TypeScript packages and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Builds both engine artefacts (baseline and SIMD); the app picks one at runtime.
      - run: pnpm build:engine
      - run: test -s packages/engine/dist/engine.wasm && test -s packages/engine/dist/engine-simd.wasm
      # Every workspace package's Vitest suite, plus the node:test suites under tools/.
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opentiles/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build:engine
      - run: test -s packages/engine/dist/engine.wasm && test -s packages/engine/dist/engine-simd.wasm
      - run: pnpm --filter @opentiles/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results

  sync-api:
    name: Sync API (Node 22)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The lowest version package.json allows (node:sqlite without a flag) and the latest 22.x.
        node: ['22.13', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opentiles/sync-api typecheck
      - run: pnpm --filter @opentiles/sync-api test
      - run: pnpm --filter @opentiles/sync-api build

  licences:
    name: Licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Only `cargo metadata` runs; nothing is compiled.
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Scanner unit tests
        run: pnpm test:tools
      - name: Licences of npm packages, Rust crates and vendored assets
        run: pnpm licences

  catalogue:
    name: Catalogue provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/pipeline/validate_catalogue.py
      - run: python3 -m unittest discover -s tools/pipeline/tests -v

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          missing=0
          for sha in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $sha is missing a Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
