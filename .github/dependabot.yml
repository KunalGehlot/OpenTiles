# Weekly dependency updates, grouped so they arrive as a few pull requests, not dozens.
# Licence compatibility is checked by the Licences CI job (see CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'deps'
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'deps'
    groups:
      cargo:
        update-types: [minor, patch]
