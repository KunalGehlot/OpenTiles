packages:
  - apps/*
  - apps/ios-shell/plugins/*
  - packages/*

# Supply-chain guard (Shai-Hulud style worms spread through versions published minutes ago): pnpm
# will not install a version younger than two days, so a hijacked release is usually unpublished
# before we can resolve to it. Remove the floor for one install only to take an urgent fix.
minimumReleaseAge: 2880

ignoredBuiltDependencies:
  # core-js only prints a donation banner in its install script.
  - core-js

overrides:
  # xcode (Capacitor CLI, iPad shell build tool only) pins uuid 7, which has an advisory.
  uuid: '>=11.1.1'

auditConfig:
  ignoreGhsas:
    # sprintf-js has no patched release. It is reached only through the argparse of TensorFlow.js
    # inside Basic Pitch, with fixed format strings: no input of ours reaches the precision specifier.
    - GHSA-hp3w-g68c-fv3c
